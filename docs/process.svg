<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 620" width="1800" height="620" role="img" aria-labelledby="t d">
  <title id="t">CrunchSim: from auction to sale</title>
  <desc id="d">Cartoon strip: scrap is bought at auction, trucked in and weighed, tipped into the intake bunker, shredded in a hammermill, sorted by magnet, air, eddy current, sink-float and sensor into buckets, smelted into ingots or baled, and sold; the credits buy the next lot and the next machine.</desc>
  <defs>
    <style>
      .ol { stroke: #0b1018; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #0b1018; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .cap { font: 700 17px "Share Tech Mono", "Cascadia Mono", Consolas, monospace; fill: #7fe3ff; letter-spacing: 2px; }
      .sub { font: 500 13px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; fill: #d6e2ee; }
      .tiny { font: 600 11px "Share Tech Mono", Consolas, monospace; fill: #0b1018; letter-spacing: 1px; }
      .tinyl { font: 600 11px "Share Tech Mono", Consolas, monospace; fill: #d6e2ee; letter-spacing: 1px; }
      .num { font: 700 16px "Share Tech Mono", Consolas, monospace; fill: #0b1018; }
      .title { font: 700 26px "Share Tech Mono", Consolas, monospace; fill: #7fe3ff; letter-spacing: 4px; }
      .money { font: 700 15px "Share Tech Mono", Consolas, monospace; fill: #ffb25c; letter-spacing: 1px; }
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d151f"/><stop offset="1" stop-color="#131c27"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff6b2b"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#1f5a99"/></linearGradient>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#7fe3ff"/></marker>
    <marker id="arr2" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#ffb25c"/></marker>
    <g id="chunk"><polygon points="-9,-6 6,-9 10,2 3,9 -8,7" /></g>
    <g id="wheel"><circle r="13" fill="#2a3240" class="ol"/><circle r="5" fill="#8d98a6"/></g>
    <g id="bucket"><path d="M-22 0 L22 0 L17 46 L-17 46 Z" class="ol"/><rect x="-25" y="-6" width="50" height="8" rx="3" fill="#3a4656" class="thin"/></g>
    <g id="ingot"><path d="M-18 10 L-13 -6 L13 -6 L18 10 Z" class="thin"/></g>
    <g id="person"><circle cy="-30" r="9" fill="#f1c9a5" class="thin"/><path d="M-14 -34 Q0 -50 14 -34 Z" fill="#ffb25c" class="thin"/><rect x="-10" y="-20" width="20" height="26" rx="5" fill="#2f6fb0" class="thin"/><rect x="-8" y="6" width="6" height="18" fill="#2a3240"/><rect x="2" y="6" width="6" height="18" fill="#2a3240"/></g>
  </defs>

  <rect width="1800" height="620" fill="url(#sky)"/>
  <g stroke="#1e2a37" stroke-width="1" opacity=".5">
    <path d="M0 80 H1800 M0 160 H1800 M0 240 H1800 M0 320 H1800 M0 400 H1800 M0 480 H1800"/>
  </g>
  <rect x="0" y="470" width="1800" height="150" fill="#0a0f16"/>
  <rect x="0" y="468" width="1800" height="4" fill="#2a3a4b"/>
  <text x="900" y="44" text-anchor="middle" class="title">CRUNCHSIM · FROM AUCTION TO SALE</text>

  <!-- ===== 1 AUCTION ===== -->
  <g transform="translate(30,100)">
    <rect x="20" y="0" width="200" height="84" rx="8" fill="#c98f5a" class="ol"/>
    <rect x="34" y="84" width="12" height="60" fill="#8a5a33" class="thin"/><rect x="194" y="84" width="12" height="60" fill="#8a5a33" class="thin"/>
    <text x="120" y="34" text-anchor="middle" class="num" style="font-size:18px">SCRAP AUCTION</text>
    <text x="120" y="60" text-anchor="middle" class="tiny">LOTS CLOSE ON THE CLOCK</text>
    <!-- lot cards -->
    <g transform="translate(14,150)">
      <rect width="100" height="50" rx="6" fill="#e9f1f7" class="thin"/><text x="8" y="18" class="tiny">LOT 7 · CARS</text><text x="8" y="33" class="tiny">60 t · $110/t</text><rect x="58" y="36" width="36" height="11" rx="3" fill="#5cffb1"/><text x="76" y="45" text-anchor="middle" class="tiny" style="font-size:8px">GREAT</text>
    </g>
    <g transform="translate(122,150)">
      <rect width="100" height="50" rx="6" fill="#e9f1f7" class="thin"/><text x="8" y="18" class="tiny">LOT 9 · TIRES</text><text x="8" y="33" class="tiny">40 t · PAID $70</text><rect x="58" y="36" width="36" height="11" rx="3" fill="#ffb25c"/><text x="76" y="45" text-anchor="middle" class="tiny" style="font-size:8px">FAIR</text>
    </g>
    <g transform="translate(68,212)">
      <rect width="100" height="50" rx="6" fill="#e9f1f7" class="thin"/><text x="8" y="18" class="tiny">LOT 11 · "STEEL"</text><text x="8" y="33" class="tiny">80 t · $90/t ?</text><rect x="52" y="36" width="42" height="11" rx="3" fill="#ff5c6c"/><text x="73" y="45" text-anchor="middle" class="tiny" style="font-size:8px">TERRIBLE</text>
    </g>
    <!-- gavel -->
    <g transform="translate(205,120) rotate(-30)"><rect x="-6" y="0" width="12" height="44" rx="3" fill="#8a5a33" class="thin"/><rect x="-22" y="-16" width="44" height="18" rx="5" fill="#c98f5a" class="thin"/></g>
    <use href="#person" transform="translate(236,262)"/>
  </g>

  <!-- arrow 1->2 -->
  <path d="M292 300 H330" stroke="#7fe3ff" stroke-width="5" marker-end="url(#arr)"/>

  <!-- ===== 2 HAUL IN ===== -->
  <g transform="translate(340,100)">
    <!-- gate -->
    <path d="M10 210 V60 Q110 0 210 60 V210" fill="none" stroke="#3a4656" stroke-width="8"/>
    <rect x="40" y="40" width="140" height="26" rx="6" fill="#1b2430" class="thin"/><text x="110" y="58" text-anchor="middle" class="tinyl">CRUNCHSIM PLANT</text>
    <!-- truck with a car on the trailer -->
    <g transform="translate(0,140)">
      <rect x="60" y="30" width="140" height="56" rx="4" fill="#8d98a6" class="ol"/>
      <!-- car silhouette -->
      <path d="M78 30 L92 8 L150 8 L166 30 Z" fill="#d8262c" class="thin"/><rect x="100" y="12" width="40" height="14" fill="#9ad9c9" class="thin"/>
      <circle cx="100" cy="30" r="8" fill="#2a3240" class="thin"/><circle cx="150" cy="30" r="8" fill="#2a3240" class="thin"/>
      <rect x="6" y="40" width="58" height="46" rx="6" fill="#ffb25c" class="ol"/><rect x="14" y="48" width="26" height="18" rx="3" fill="#9ad9c9" class="thin"/>
      <use href="#wheel" transform="translate(32,92)"/><use href="#wheel" transform="translate(96,92)"/><use href="#wheel" transform="translate(130,92)"/><use href="#wheel" transform="translate(184,92)"/>
      <path d="M-30 50 h22 M-36 66 h26 M-30 82 h22" stroke="#7fe3ff" stroke-width="3" opacity=".7"/>
    </g>
    <!-- weighbridge -->
    <rect x="40" y="250" width="170" height="14" rx="4" fill="#3a4656" class="thin"/>
    <rect x="86" y="268" width="82" height="24" rx="4" fill="#1b2430" class="thin"/><text x="127" y="285" text-anchor="middle" class="tinyl" style="fill:#5cffb1">60.0 t</text>
  </g>

  <path d="M562 300 H600" stroke="#7fe3ff" stroke-width="5" marker-end="url(#arr)"/>

  <!-- ===== 3 OFFLOAD INTO BIN ===== -->
  <g transform="translate(610,66)">
    <!-- tipper tilted -->
    <g transform="translate(20,150) rotate(-22 120 60)">
      <rect x="50" y="20" width="120" height="50" rx="4" fill="#8d98a6" class="ol"/>
      <g fill="#8d98a6"><use href="#chunk" transform="translate(70,10)" fill="#8d98a6"/><use href="#chunk" transform="translate(100,6)" fill="#d8262c"/><use href="#chunk" transform="translate(130,10)" fill="#b98a54"/><use href="#chunk" transform="translate(155,16)" fill="#cfd9e2"/></g>
      <rect x="0" y="30" width="52" height="40" rx="6" fill="#ffb25c" class="ol"/>
      <use href="#wheel" transform="translate(26,76)"/><use href="#wheel" transform="translate(96,76)"/><use href="#wheel" transform="translate(140,76)"/>
    </g>
    <!-- falling chunks -->
    <use href="#chunk" transform="translate(178,210)" fill="#8d98a6" class="thin"/><use href="#chunk" transform="translate(196,236)" fill="#d98a5b" class="thin"/><use href="#chunk" transform="translate(170,250)" fill="#b98a54" class="thin"/><use href="#chunk" transform="translate(200,268)" fill="#cfd9e2" class="thin"/>
    <!-- bunker -->
    <path d="M120 290 L240 290 L220 360 L140 360 Z" fill="#1b2430" class="ol"/>
    <path d="M136 326 Q180 286 224 326 L218 350 L142 350 Z" fill="#3a4656"/>
    <g class="thin"><use href="#chunk" transform="translate(160,322)" fill="#8d98a6"/><use href="#chunk" transform="translate(182,314)" fill="#e8695a"/><use href="#chunk" transform="translate(204,324)" fill="#9ad9c9"/><use href="#chunk" transform="translate(172,338)" fill="#b98a54"/><use href="#chunk" transform="translate(196,340)" fill="#cfd9e2"/></g>
    <rect x="118" y="364" width="124" height="20" rx="4" fill="#0f1a26" class="thin"/><text x="180" y="378" text-anchor="middle" class="tinyl">INTAKE BUNKER · 2,400 t</text>
  </g>

  <path d="M862 300 H900" stroke="#7fe3ff" stroke-width="5" marker-end="url(#arr)"/>

  <!-- ===== 4 SHRED ===== -->
  <g transform="translate(910,100)">
    <path d="M30 150 L130 150 L110 200 L50 200 Z" fill="#1b2430" class="ol"/>
    <rect x="20" y="200" width="120" height="110" rx="10" fill="#242e3a" class="ol"/>
    <circle cx="80" cy="255" r="38" fill="#0d131a" class="thin"/>
    <g transform="translate(80,255)" fill="#8d98a6" class="thin">
      <rect x="-5" y="-34" width="10" height="68" rx="3"/><rect x="-34" y="-5" width="68" height="10" rx="3"/>
      <rect x="-26" y="-26" width="10" height="52" rx="3" transform="rotate(45)"/><rect x="-26" y="-26" width="10" height="52" rx="3" transform="rotate(-45)"/>
      <circle r="8" fill="#10151c"/>
    </g>
    <!-- sparks and pieces flying out -->
    <g fill="#ffd27a"><circle cx="118" cy="232" r="3"/><circle cx="126" cy="246" r="2.5"/><circle cx="122" cy="262" r="2"/></g>
    <g class="thin"><use href="#chunk" transform="translate(150,290) scale(.55)" fill="#8d98a6"/><use href="#chunk" transform="translate(166,298) scale(.5)" fill="#d8262c"/><use href="#chunk" transform="translate(182,292) scale(.55)" fill="#b98a54"/></g>
    <rect x="18" y="318" width="124" height="20" rx="4" fill="#0f1a26" class="thin"/><text x="80" y="332" text-anchor="middle" class="tinyl">HAMMERMILL · 2 MW</text>
    <path d="M30 150 h100" stroke="#ffb25c" stroke-width="3" stroke-dasharray="8 5"/>
  </g>

  <path d="M1102 300 H1140" stroke="#7fe3ff" stroke-width="5" marker-end="url(#arr)"/>

  <!-- ===== 5 SORT ===== -->
  <g transform="translate(1150,70)">
    <!-- conveyor -->
    <rect x="0" y="286" width="400" height="12" rx="6" fill="#20252d" class="thin"/>
    <g stroke="#3a4656" stroke-width="2"><path d="M14 288 v8 M34 288 v8 M54 288 v8 M74 288 v8 M94 288 v8 M114 288 v8 M134 288 v8 M154 288 v8 M174 288 v8 M194 288 v8 M214 288 v8 M234 288 v8 M254 288 v8 M274 288 v8 M294 288 v8 M314 288 v8 M334 288 v8 M354 288 v8 M374 288 v8"/></g>
    <!-- magnet drum -->
    <g transform="translate(40,230)">
      <circle r="26" fill="#2a3240" class="ol"/>
      <path d="M0 0 L26 0 A26 26 0 0 0 0 -26 Z" fill="#b84a4a"/><path d="M0 0 L0 -26 A26 26 0 0 0 -26 0 Z" fill="#3b6ea5"/><path d="M0 0 L-26 0 A26 26 0 0 0 0 26 Z" fill="#b84a4a"/><path d="M0 0 L0 26 A26 26 0 0 0 26 0 Z" fill="#3b6ea5"/>
      <circle r="26" fill="none" class="thin"/>
      <g fill="#8d98a6" class="thin"><use href="#chunk" transform="translate(-8,-40) scale(.5)"/><use href="#chunk" transform="translate(10,-48) scale(.45)"/><use href="#chunk" transform="translate(-2,-60) scale(.4)"/></g>
      <text x="0" y="-74" text-anchor="middle" class="tinyl">MAGNET</text>
    </g>
    <!-- zig-zag air column -->
    <g transform="translate(120,150)">
      <path d="M-10 130 L10 108 L-10 86 L10 64 L-10 42 L10 20 L-10 0" fill="none" stroke="#3a4656" stroke-width="6"/>
      <path d="M26 130 L46 108 L26 86 L46 64 L26 42 L46 20 L26 0" fill="none" stroke="#3a4656" stroke-width="6"/>
      <g fill="#b98a54" class="thin"><use href="#chunk" transform="translate(18,100) scale(.45)"/><use href="#chunk" transform="translate(14,66) scale(.45)" fill="#e8695a"/><use href="#chunk" transform="translate(20,30) scale(.4)"/></g>
      <path d="M18 128 v-120" stroke="#7fe3ff" stroke-width="2" stroke-dasharray="3 5" opacity=".7"/>
      <text x="18" y="-10" text-anchor="middle" class="tinyl">AIR</text>
    </g>
    <!-- eddy current -->
    <g transform="translate(220,230)">
      <circle r="24" fill="#0d131a" class="ol"/>
      <g><path d="M0 0 L24 0 A24 24 0 0 0 17 -17 Z" fill="#b84a4a"/><path d="M0 0 L17 -17 A24 24 0 0 0 0 -24 Z" fill="#3b6ea5"/><path d="M0 0 L0 -24 A24 24 0 0 0 -17 -17 Z" fill="#b84a4a"/><path d="M0 0 L-17 -17 A24 24 0 0 0 -24 0 Z" fill="#3b6ea5"/><path d="M0 0 L-24 0 A24 24 0 0 0 -17 17 Z" fill="#b84a4a"/><path d="M0 0 L-17 17 A24 24 0 0 0 0 24 Z" fill="#3b6ea5"/><path d="M0 0 L0 24 A24 24 0 0 0 17 17 Z" fill="#b84a4a"/><path d="M0 0 L17 17 A24 24 0 0 0 24 0 Z" fill="#3b6ea5"/></g>
      <circle r="24" fill="none" class="thin"/>
      <path d="M26 -14 q26 -34 60 -22" fill="none" stroke="#cfd9e2" stroke-width="3" stroke-dasharray="4 4"/>
      <use href="#chunk" transform="translate(62,-40) scale(.5)" fill="#cfd9e2" class="thin"/>
      <text x="0" y="-36" text-anchor="middle" class="tinyl">EDDY</text>
    </g>
    <!-- sink-float -->
    <g transform="translate(300,236)">
      <rect x="-28" y="-20" width="56" height="44" rx="4" fill="url(#water)" class="ol"/>
      <use href="#chunk" transform="translate(-10,-18) scale(.45)" fill="#cfd9e2" class="thin"/>
      <use href="#chunk" transform="translate(8,12) scale(.45)" fill="#d98a5b" class="thin"/><use href="#chunk" transform="translate(-12,14) scale(.4)" fill="#d9b94e" class="thin"/>
      <text x="0" y="-32" text-anchor="middle" class="tinyl">SINK-FLOAT</text>
    </g>
    <!-- sensor arch -->
    <g transform="translate(386,230)">
      <path d="M-14 56 V-6 Q0 -22 14 -6 V56" fill="none" stroke="#5cffb1" stroke-width="5"/>
      <path d="M-4 0 v40 M4 0 v40" stroke="#5cffb1" stroke-width="1.5" stroke-dasharray="2 3"/>
      <text x="0" y="-30" text-anchor="middle" class="tinyl">SENSOR</text>
    </g>
    <!-- buckets -->
    <g transform="translate(0,318)">
      <g transform="translate(24,0)"><use href="#bucket" fill="#8d98a6"/><text x="0" y="62" text-anchor="middle" class="tinyl" style="font-size:9px">STEEL</text></g>
      <g transform="translate(80,0)"><use href="#bucket" fill="#b98a54"/><text x="0" y="62" text-anchor="middle" class="tinyl" style="font-size:9px">WOOD</text></g>
      <g transform="translate(136,0)"><use href="#bucket" fill="#e8695a"/><text x="0" y="62" text-anchor="middle" class="tinyl" style="font-size:9px">PLASTIC</text></g>
      <g transform="translate(192,0)"><use href="#bucket" fill="#cfd9e2"/><text x="0" y="62" text-anchor="middle" class="tinyl" style="font-size:9px">ALUMINUM</text></g>
      <g transform="translate(248,0)"><use href="#bucket" fill="#d98a5b"/><text x="0" y="62" text-anchor="middle" class="tinyl" style="font-size:9px">COPPER</text></g>
      <g transform="translate(304,0)"><use href="#bucket" fill="#d9b94e"/><text x="0" y="62" text-anchor="middle" class="tinyl" style="font-size:9px">BRASS</text></g>
      <g transform="translate(360,0)"><use href="#bucket" fill="#9ad9c9"/><text x="0" y="62" text-anchor="middle" class="tinyl" style="font-size:9px">GLASS</text></g>
    </g>
  </g>

  <path d="M1556 300 H1588" stroke="#7fe3ff" stroke-width="5" marker-end="url(#arr)"/>

  <!-- ===== 6 SMELT / FINISH ===== -->
  <g transform="translate(1596,100)">
    <!-- furnace -->
    <rect x="10" y="170" width="90" height="100" rx="12" fill="#3a4656" class="ol"/>
    <rect x="30" y="140" width="18" height="40" fill="#2a3240" class="thin"/>
    <g fill="#8d98a6" opacity=".6"><circle cx="39" cy="128" r="8"/><circle cx="48" cy="114" r="10"/><circle cx="36" cy="100" r="7"/></g>
    <rect x="28" y="196" width="54" height="40" rx="6" fill="url(#glow)" class="thin"/>
    <path d="M100 236 q24 4 34 36" fill="none" stroke="#ff8a2b" stroke-width="7" stroke-linecap="round"/>
    <!-- ingots -->
    <g transform="translate(140,286)">
      <use href="#ingot" transform="translate(0,-6)" fill="#d98a5b"/><use href="#ingot" transform="translate(-20,10)" fill="#cfd9e2"/><use href="#ingot" transform="translate(20,10)" fill="#cfd9e2"/>
    </g>
    <text x="55" y="162" text-anchor="middle" class="tinyl">FURNACE</text>
    <!-- bale -->
    <g transform="translate(160,186)">
      <rect x="-22" y="-20" width="44" height="40" rx="4" fill="#e8695a" class="ol"/>
      <path d="M-22 -8 h44 M-22 8 h44" stroke="#0b1018" stroke-width="3"/>
      <text x="0" y="-30" text-anchor="middle" class="tinyl">BALER</text>
    </g>
    <rect x="8" y="318" width="194" height="20" rx="4" fill="#0f1a26" class="thin"/><text x="105" y="332" text-anchor="middle" class="tinyl">INGOTS · BALES · UNITS</text>
  </g>

  <!-- ===== 7 SELL (right edge) ===== -->
  <g transform="translate(1706,60)">
    <rect x="-30" y="330" width="90" height="12" rx="3" fill="#8a5a33" class="thin"/>
    <rect x="-70" y="30" width="150" height="26" rx="6" fill="#0a0f16" stroke="#ffb25c" stroke-width="2"/>
    <text x="5" y="48" text-anchor="middle" class="money">SOLD · $8,200/t</text>
  </g>

  <!-- bottom: captions and numbers -->
  <g transform="translate(0,500)">
    <g transform="translate(150,0)"><circle r="16" fill="#ffb25c" class="thin"/><text y="6" text-anchor="middle" class="num">1</text><text y="42" text-anchor="middle" class="cap">AUCTION</text><text y="62" text-anchor="middle" class="sub">Bid on lots. Some are deals, some are traps.</text></g>
    <g transform="translate(450,0)"><circle r="16" fill="#ffb25c" class="thin"/><text y="6" text-anchor="middle" class="num">2</text><text y="42" text-anchor="middle" class="cap">HAUL IN</text><text y="62" text-anchor="middle" class="sub">Trucked to the gate and weighed.</text></g>
    <g transform="translate(730,0)"><circle r="16" fill="#ffb25c" class="thin"/><text y="6" text-anchor="middle" class="num">3</text><text y="42" text-anchor="middle" class="cap">OFFLOAD</text><text y="62" text-anchor="middle" class="sub">Tipped into the intake bunker.</text></g>
    <g transform="translate(990,0)"><circle r="16" fill="#ffb25c" class="thin"/><text y="6" text-anchor="middle" class="num">4</text><text y="42" text-anchor="middle" class="cap">SHRED</text><text y="62" text-anchor="middle" class="sub">Hammermill breaks it into bits.</text></g>
    <g transform="translate(1300,0)"><circle r="16" fill="#ffb25c" class="thin"/><text y="6" text-anchor="middle" class="num">5</text><text y="42" text-anchor="middle" class="cap">SORT</text><text y="62" text-anchor="middle" class="sub">Magnet, air, eddy, sink-float, sensor. One bucket each.</text></g>
    <g transform="translate(1640,0)"><circle r="16" fill="#ffb25c" class="thin"/><text y="6" text-anchor="middle" class="num">6</text><text y="42" text-anchor="middle" class="cap">SMELT &amp; SELL</text><text y="62" text-anchor="middle" class="sub">Ingots and bales go out. Credits come in.</text></g>
  </g>

  <!-- return loop -->
  <path d="M1778 445 V596 H24 V330" fill="none" stroke="#ffb25c" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#arr2)"/>
  <rect x="750" y="584" width="340" height="24" rx="5" fill="#0a0f16" class="thin"/>
  <text x="920" y="601" text-anchor="middle" class="money">CREDITS BUY THE NEXT LOT AND THE NEXT MACHINE</text>
</svg>
